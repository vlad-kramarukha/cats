name: Build and deploy cats

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "nginx/**"
      - "compose.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cats-production
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}

jobs:
  build-app:
    name: Build application
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build application image
        run: |
          docker info > /dev/null
          docker compose config --quiet
          docker compose build --pull cats-app

  build-nginx:
    name: Build Nginx
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Nginx image
        run: |
          docker info > /dev/null
          docker compose config --quiet
          docker compose build --pull nginx-core

  deploy:
    name: Deploy
    needs: [build-app, build-nginx]
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check local images
        run: |
          docker image inspect "cats-app:$IMAGE_TAG" > /dev/null
          docker image inspect "cats-nginx:$IMAGE_TAG" > /dev/null
      - name: Validate Nginx configuration
        run: docker compose run --rm --no-deps nginx-core nginx -t
      - name: Deploy both images
        run: docker compose up -d --no-build --wait --wait-timeout 90
      - name: Show status
        run: docker compose ps
      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 100
