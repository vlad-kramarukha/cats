name: 'cats-app-pipeline'

on:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - name: Build application image
        run: |
          docker info > /dev/null
          docker compose config --quiet
          docker compose build --pull cats-app
          
  nginx:
    runs-on: self-hosted
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Build nginx image
        run: |  
          docker info > /dev/null
          docker compose config --quiet
          docker compose build --pull nginx-core

  deploy:
    runs-on: self-hosted
    needs: [build, nginx]
    steps:
      - uses: actions/checkout@v7

      - name: Deploy both images
        run: docker compose up -d --no-build --wait --wait-timeout 90

      - name: Show status
        run: docker compose ps

      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 100