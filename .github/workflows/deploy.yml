name: Build and deploy cats

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "compose.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cats-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CATS_HTTP_PORT: ${{ vars.CATS_HTTP_PORT || '80' }}
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Docker and Compose
        run: |
          docker info > /dev/null
          docker compose version
          docker compose config --quiet

      - name: Build image
        run: docker compose build --pull web

      - name: Deploy and wait for healthcheck
        run: docker compose up -d --no-build --wait --wait-timeout 90 web

      - name: Show deployment status
        run: docker compose ps

      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 100 web
