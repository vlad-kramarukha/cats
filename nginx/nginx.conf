worker_processes auto;
worker_cpu_affinity auto;

pcre_jit on;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
    accept_mutex on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    include /etc/nginx/settings/*.conf;

    error_log /dev/stderr;
    access_log /dev/stdout;

    gzip on;
    gzip_static on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "img-src 'self' https: data:";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/apps/*.conf;
}
