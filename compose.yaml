name: cats

services:
  web:
    image: cats:${IMAGE_TAG:-local}
    build:
      context: ./app
    restart: unless-stopped
    ports:
      - "${CATS_HTTP_PORT:-80}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
